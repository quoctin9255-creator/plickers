<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trả lời bằng thẻ – màn hình tivi</title>
<style>
  :root{--bg:#10151a;--card:#1b232b;--ink:#f4f6f7;--mut:#93a0aa;--ok:#3ddc97;--bad:#ef6a6a;
        --c0:#ef6a6a;--c1:#5b9cf5;--c2:#f5b042;--c3:#3ddc97;--z:1;--fit:1}
  html{font-size:calc(clamp(15px,1.45vw,34px)*var(--z)*var(--fit))}
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  body{margin:0;height:100vh;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);color:var(--ink);
       font:1rem/1.35 system-ui,"Segoe UI",sans-serif}
  header{display:flex;align-items:center;gap:1.4rem;padding:.35rem 1.2rem;color:var(--mut)}
  #num{font-size:1.5rem;font-weight:700;color:var(--ink)}
  #clock{margin-left:auto;font-size:2rem;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
  #clock.idle{color:var(--mut)} #clock.hot{color:var(--bad);animation:bl 1s steps(2) infinite}
  @keyframes bl{50%{opacity:.35}}
  #cnt{font-size:1.3rem;color:var(--ink)}
  #dot{font-size:1rem} #dot.on{color:var(--ok)} #dot.off{color:var(--bad)}
  main{flex:1;min-height:0;display:grid;grid-template-columns:2fr 1fr;gap:1.2rem;padding:0 1.2rem 1rem}
  #qa{overflow:auto;padding-right:.2rem}
  #end{margin-bottom:.7rem;padding:.4rem 1rem;border-radius:.8rem;background:var(--bad);color:#fff;font-size:1.6rem;font-weight:800;text-align:center}
  #q{font-size:2.1rem;font-weight:700;line-height:1.25;margin-bottom:.9rem}
  .o{position:relative;overflow:hidden;display:flex;align-items:center;gap:1rem;background:var(--card);border-radius:1rem;
     padding:.8rem 1rem .9rem;margin-bottom:.6rem;font-size:1.5rem;line-height:1.3;border:.18rem solid transparent}
  .o .l{flex:none;width:2.6rem;height:2.6rem;border-radius:50%;background:var(--c);color:#111;font-weight:800;
        display:grid;place-items:center;font-size:1.6rem}
  .o .t{flex:1}
  .o .n{flex:none;font-size:2rem;font-weight:800;color:var(--c);text-align:right;line-height:1}
  .o .n small{display:block;font-size:.9rem;font-weight:600;color:var(--mut);margin-top:.15rem}
  .o i{position:absolute;left:0;bottom:0;height:.5rem;background:var(--c)}
  .o.ok{border-color:var(--ok)} .o.dim{opacity:.4}
  #stu{display:grid;gap:.4rem;align-content:start;overflow:auto}
  #stu span{padding:.3rem .7rem;border-radius:.6rem;background:var(--card);color:#56636d;font-size:1rem;
            white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #stu .on{background:#2c3b47;color:var(--ink)}
  #stu .good{background:#1c5a40;color:#fff} #stu .bad{background:#6b2a2a;color:#fff}
  #sumv{position:fixed;inset:0;z-index:5;background:var(--bg);padding:.8rem 1.5rem;overflow:auto}
  #sumv h2{margin:0 0 .6rem;font-size:1.8rem}
  #sumv .g{display:grid;grid-template-columns:repeat(2,1fr);gap:.3rem 1.5rem}
  #sumv .r{display:flex;gap:.8rem;padding:.25rem .7rem;border-radius:.6rem;background:var(--card);font-size:1.25rem}
  #sumv .r b{width:2.2rem;color:var(--mut)} #sumv .r span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #sumv .r em{font-style:normal;font-weight:800;color:var(--ok)}
  #au{position:fixed;right:.6rem;bottom:.4rem;opacity:.5}
</style>
</head>
<body>
<header><span id="num">Câu –</span><span id="clock"></span><span id="cnt"></span><span id="dot"></span></header>
<main>
  <section id="qa"><div id="end" hidden>Hết giờ! Giơ thẻ lên</div><div id="q">Đang tải…</div><div id="opts"></div></section>
  <aside id="stu"></aside>
</main>
<div id="sumv" hidden></div>
<span id="au" hidden>🔇</span>

<script src="common.js"></script>
<script>
let ac=null,beepKey=null,seeded=false,wasSum=false;
function unlock(){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume();$('#au').hidden=ac.state==='running'}catch(e){}}
['pointerdown','keydown'].forEach(e=>addEventListener(e,unlock));
function beep(){
  if(!ac||Number(PL.L.state.snd)===0)return;
  try{[0,.3,.6].forEach(d=>{const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=880;g.gain.value=.15;
    o.connect(g);g.connect(ac.destination);o.start(ac.currentTime+d);o.stop(ac.currentTime+d+.18)})}catch(e){}
}

function draw(){
  const F=PL.F,L=PL.L;if(!F||!L)return;
  const s=L.state,Q=F.questions[Number(s.cau)-1],open=Number(s.mo)===1;
  const showSum=Number(s.sum)===1;
  if(showSum&&!wasSum){wasSum=true;loadFull();return}   // vừa bật tổng kết: tải kết quả mới nhất rồi vẽ lại
  if(!showSum)wasSum=false;
  const rev=Number(s.rev)===1,show=rev||Number(s.live)===1;
  document.documentElement.style.setProperty('--z',Number(s.z)||1);
  const ids=new Set(F.students.map(x=>x.id)),mine=L.answers.filter(a=>ids.has(a.id));
  const got=new Map(mine.map(a=>[a.id,a.ans])),cnt=[0,0,0,0];
  mine.forEach(a=>{const i=LET.indexOf(a.ans);if(i>=0)cnt[i]++});
  const mx=Math.max(1,...cnt),tot=Math.max(1,mine.length),okI=Q?LET.indexOf(Q.ok):-1;
  $('#num').textContent='Câu '+s.cau+'/'+F.questions.length;
  $('#q').textContent=Q?Q.q:'Không có câu hỏi. Hãy kiểm tra tab '+s.bo;
  $('#opts').innerHTML=LET.map((l,i)=>`<div class="o ${rev&&Q?(i===okI?'ok':'dim'):''}" style="--c:var(--c${i})">
    <span class="l">${l}</span><span class="t">${esc(Q?Q.opts[i]:'')}</span>${show?`<span class="n">${cnt[i]}<small>${Math.round(cnt[i]/tot*100)}%</small></span><i style="width:${cnt[i]/mx*100}%"></i>`:''}</div>`).join('');
  const st=$('#stu');st.style.gridTemplateColumns='repeat('+(F.students.length>30?3:2)+',1fr)';
  st.innerHTML=F.students.map(x=>{const a=got.get(x.id);let c='';
    if(a){c='on';if(rev&&Q)c+=a===Q.ok?' good':' bad'}return `<span class="${c}" title="${esc(x.name)}">${esc(x.name)}</span>`}).join('');
  let t='Đã quét '+got.size+'/'+F.students.length;
  if(rev&&Q&&okI>=0&&mine.length)t+=' · Đúng '+cnt[okI]+' ('+Math.round(cnt[okI]/mine.length*100)+'%)';
  $('#cnt').textContent=t;
  const d=$('#dot');d.textContent=open?'● Nhận bài':'■ Đã khóa';d.className=open?'on':'off';
  renderSum(showSum);fit();tick();
}
function renderSum(on){
  const el=$('#sumv');el.hidden=!on;if(!on)return;
  const rows=summaryRows(),tot=summaryTotal();
  el.innerHTML=`<h2>Tổng kết · ${tot} câu đã làm</h2><div class="g">`+
    rows.map((r,i)=>`<div class="r"><b>${i+1}</b><span>${esc(r.n)}</span><em>${r.ok}/${tot}</em></div>`).join('')+'</div>';
}
// Tự thu nhỏ chữ cho vừa màn hình: câu hỏi, đủ 4 đáp án và danh sách học sinh luôn hiện đủ, không phải cuộn
function fit(){
  const r=document.documentElement,qa=$('#qa'),st=$('#stu'),ov=$('#sumv');
  let f=1;r.style.setProperty('--fit',f);
  while(f>.35&&(qa.scrollHeight>qa.clientHeight+1||st.scrollHeight>st.clientHeight+1||(!ov.hidden&&ov.scrollHeight>ov.clientHeight+1))){
    f=+(f-.04).toFixed(2);r.style.setProperty('--fit',f);
  }
}
addEventListener('resize',()=>{if(PL.F)fit()});
function tick(){
  if(!PL.L||!PL.F)return;
  const st=PL.L.state,run=st.tst==='run';
  let ms=remainMs();
  const done=run&&ms<=0,k=st.cau+'|'+st.tend;
  if(!seeded){seeded=true;if(done)beepKey=k}
  if(done&&beepKey!==k){beepKey=k;beep()}
  const s=Math.ceil(Math.max(0,ms)/1000),c=$('#clock');
  c.textContent='⏱ '+Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
  c.className=done||(run&&s<=10)?'hot':(st.tst==='run'||st.tst==='pause')?'':'idle';
  $('#end').hidden=!done;
}
setInterval(tick,250);

PL.onchange=draw;
PL.onerror=()=>{if(!PL.F)$('#q').textContent='Không tải được dữ liệu. Kiểm tra URL Apps Script ở trang cài đặt.'};
boot().then(ok=>{if(!ok)$('#q').textContent='Chưa có URL. Mở trang cài đặt (cai-dat.html) để nhập.'});

// Phím tắt trên máy tính (điều khiển chính nằm trên điện thoại và trang cài đặt)
addEventListener('keydown',e=>{
  if(!PL.F)return;
  const k=e.key;
  if(k==='ArrowRight')go(1); else if(k==='ArrowLeft')go(-1);
  else if(k===' '){e.preventDefault();reveal()}
  else if(k==='t'||k==='T')tmr(PL.L.state.tst==='run'?'pause':'start');
  else if(k==='s'||k==='S')toggle('live');
  else if(k==='g'||k==='G')toggle('sum');
  else if(k==='+'||k==='=')zoomBy(.1); else if(k==='-')zoomBy(-.1);
});
</script>
</body>
</html>
