<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cài đặt – trả lời bằng thẻ</title>
<style>
  :root{--bg:#10151a;--card:#1b232b;--ink:#f4f6f7;--mut:#93a0aa;--ok:#3ddc97;--line:#2b3842}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 system-ui,"Segoe UI",sans-serif}
  .wrap{max-width:760px;margin:0 auto;padding:18px}
  h1{font-size:1.4rem;margin:.2rem 0 .2rem} .sub{color:var(--mut);margin:0 0 1rem}
  section{background:var(--card);border-radius:14px;padding:14px 16px;margin:12px 0}
  h2{font-size:1rem;color:var(--mut);margin:0 0 10px;font-weight:600}
  label{display:block;margin:8px 0 4px;color:var(--mut);font-size:.9rem}
  select,button{font:inherit;padding:10px 14px;border-radius:10px;border:1px solid #33414c;background:#0f1519;color:var(--ink)}
  select{width:100%}
  button{margin:4px 6px 4px 0;cursor:pointer} button.p{background:var(--ok);border:0;color:#06210f;font-weight:700}
  button.on{border-color:var(--ok);color:var(--ok)}
  a{color:var(--ok)}
  table{width:100%;border-collapse:collapse;margin-top:10px}
  td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
  #msg{color:var(--mut);margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Cài đặt</h1>
  <p class="sub">Dùng khi chuẩn bị. Đừng mở trang này trên màn hình đang chiếu cho học sinh.</p>

  <section>
    <h2>Lớp và bộ câu hỏi</h2>
    <label for="lop">Lớp (tab bắt đầu bằng HS_)</label><select id="lop"></select>
    <label for="bo">Bộ câu hỏi (tab bắt đầu bằng CH_)</label><select id="bo"></select>
    <button id="new" class="p">Phiên mới</button>
    <div id="msg"></div>
  </section>

  <section>
    <h2>Hiển thị trên tivi</h2>
    <button id="live">Thống kê trực tiếp</button>
    <button id="snd">Âm báo hết giờ</button>
    <button id="zm">Chữ nhỏ −</button><button id="zp">Chữ to +</button><span id="zv"></span>
  </section>

  <section>
    <h2>Kết nối</h2>
    <button id="lnk">Sao chép link điện thoại</button>
    <button id="api">Đổi URL Apps Script</button>
    <p class="sub">Mở trang tivi: <a href="tv.html" target="_blank">tv.html</a></p>
  </section>

  <section>
    <h2>Tổng kết phiên hiện tại</h2>
    <button id="sum">Xem bảng tổng kết</button>
    <div id="tbl"></div>
  </section>
</div>

<script src="common.js"></script>
<script>
let sig='';
function fill(){
  const F=PL.F,s=PL.L.state,g=F.tabs.lop.join()+'|'+F.tabs.bo.join()+'|'+s.lop+'|'+s.bo;
  if(g===sig)return;sig=g;
  const o=(arr,v)=>arr.map(n=>`<option ${n===v?'selected':''}>${esc(n)}</option>`).join('');
  $('#lop').innerHTML=o(F.tabs.lop,s.lop);$('#bo').innerHTML=o(F.tabs.bo,s.bo);
}
function draw(){
  if(!PL.F||!PL.L)return;
  fill();
  const s=PL.L.state;
  $('#live').classList.toggle('on',Number(s.live)===1);
  $('#snd').classList.toggle('on',Number(s.snd)!==0);
  $('#zv').textContent=' Cỡ chữ: '+Math.round((Number(s.z)||1)*100)+'%';
}
const pick=()=>({lop:$('#lop').value,bo:$('#bo').value,cau:1,mo:1,rev:0,phien:'P'+Date.now()});
$('#lop').onchange=()=>send(pick(),{mode:'reset',sec:90});
$('#bo').onchange=()=>send(pick(),{mode:'reset',sec:90});
$('#new').onclick=()=>{if(confirm('Bắt đầu phiên mới? Kết quả cũ vẫn được giữ trong Sheet.')){newSession().then(()=>{$('#msg').textContent='Đã bắt đầu phiên mới.'})}};
$('#live').onclick=()=>toggle('live');
$('#snd').onclick=()=>send({snd:Number(PL.L.state.snd)===0?1:0});
$('#zp').onclick=()=>zoomBy(.1);$('#zm').onclick=()=>zoomBy(-.1);
$('#api').onclick=()=>{if(askApi())location.reload()};
$('#lnk').onclick=async()=>{
  const u=new URL('scan.html',location.href).href+'#api='+encodeURIComponent(PL.api);
  try{await navigator.clipboard.writeText(u);alert('Đã sao chép. Gửi link này sang điện thoại (Zalo) rồi mở bằng Chrome/Safari.')}catch(e){prompt('Sao chép link này:',u)}
};
$('#sum').onclick=async()=>{
  await loadFull();
  $('#tbl').innerHTML='<table><tr><th>#</th><th>Học sinh</th><th>Đúng</th><th>Đã trả lời</th></tr>'+
    summaryRows().map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.n)}</td><td>${r.ok}/${PL.F.questions.length}</td><td>${r.done}</td></tr>`).join('')+'</table>';
};
PL.onchange=draw;
PL.onerror=()=>{$('#msg').textContent='Không tải được dữ liệu. Kiểm tra URL Apps Script.'};
boot();
</script>
</body>
</html>
