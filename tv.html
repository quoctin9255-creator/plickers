<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trả lời bằng thẻ – màn hình tivi</title>
<style>
  :root{--bg:#10151a;--card:#1b232b;--ink:#f4f6f7;--mut:#93a0aa;--ok:#3ddc97;--bad:#ef6a6a;
        --c0:#ef6a6a;--c1:#5b9cf5;--c2:#f5b042;--c3:#3ddc97}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.35 system-ui,"Segoe UI",sans-serif;padding-bottom:84px}
  header{display:flex;justify-content:space-between;align-items:baseline;padding:14px 28px;color:var(--mut)}
  #num{font-size:28px;font-weight:700;color:var(--ink)}
  #q{font-size:clamp(26px,3.6vw,52px);font-weight:700;line-height:1.25;padding:6px 28px 18px}
  #opts{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:0 28px}
  .o{position:relative;overflow:hidden;background:var(--card);border-radius:16px;padding:18px 20px 22px 76px;
     font-size:clamp(20px,2.3vw,32px);min-height:96px;border:4px solid transparent}
  .o .l{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;
        background:var(--c);color:#111;font-weight:800;display:grid;place-items:center;font-size:26px}
  .o .n{position:absolute;right:16px;top:10px;font-size:34px;font-weight:800;color:var(--c)}
  .o i{position:absolute;left:0;bottom:0;height:8px;background:var(--c)}
  .o.ok{border-color:var(--ok)} .o.dim{opacity:.4}
  #stu{display:flex;flex-wrap:wrap;gap:8px;padding:20px 28px}
  #stu span{padding:6px 12px;border-radius:999px;background:var(--card);color:#5d6b76;font-size:17px}
  #stu .on{background:#2c3b47;color:var(--ink)}
  #stu .good{background:#1c5a40;color:#fff} #stu .bad{background:#6b2a2a;color:#fff}
  nav{position:fixed;left:0;right:0;bottom:0;display:flex;flex-wrap:wrap;gap:8px;align-items:center;
      padding:10px 18px;background:#0b0f13;border-top:1px solid #26313a}
  button,select{font:inherit;font-size:16px;padding:9px 14px;border-radius:10px;border:1px solid #33414c;background:#1b232b;color:var(--ink)}
  button.p{background:var(--ok);color:#06210f;border:0;font-weight:700}
  #ov{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;overflow:auto;padding:30px}
  #ov table{margin:auto;border-collapse:collapse;min-width:420px;font-size:22px}
  #ov td,#ov th{padding:8px 16px;border-bottom:1px solid #2b3842;text-align:left}
</style>
</head>
<body>
<header><span id="num">Câu –</span><span id="cnt"></span><span id="st">Đang tải…</span></header>
<div id="q"></div>
<div id="opts"></div>
<div id="stu"></div>

<nav>
  <button id="prev">◀ Câu trước</button>
  <button id="next" class="p">Câu sau ▶</button>
  <button id="rev">Hiện đáp án (Space)</button>
  <button id="mo"></button>
  <select id="lop" title="Lớp"></select>
  <select id="bo" title="Bộ câu hỏi"></select>
  <button id="sum">Tổng kết</button>
  <button id="new">Phiên mới</button>
  <button id="lnk">Sao chép link điện thoại</button>
  <button id="api">Đổi URL</button>
</nav>
<div id="ov"><p style="text-align:center"><button id="x">Đóng</button></p><div id="tbl"></div></div>

<script>
const $=s=>document.querySelector(s), LET=['A','B','C','D'];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let API=localStorage.getItem('pl_api')||'';
function askApi(){const v=prompt('Dán URL ứng dụng web Apps Script (kết thúc bằng /exec):',API);if(v){API=v.trim();localStorage.setItem('pl_api',API);return true}return false}
if(!API&&!askApi())document.body.insertAdjacentHTML('afterbegin','<p style="padding:30px">Chưa có URL. Tải lại trang và dán URL Apps Script.</p>');

let F=null,L=null,rev=false,hold=0;
const get=async a=>(await fetch(API+'?action='+a,{cache:'no-store'})).json();
const post=o=>fetch(API,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(o)});

async function loadFull(){
  F=await get('full');
  L={state:F.state,answers:F.results.filter(r=>r.cau===Number(F.state.cau))};
  const o=(arr,v)=>arr.map(n=>`<option ${n===v?'selected':''}>${esc(n)}</option>`).join('');
  $('#lop').innerHTML=o(F.tabs.lop,F.state.lop); $('#bo').innerHTML=o(F.tabs.bo,F.state.bo);
  draw();
}
async function poll(){
  if(!API||Date.now()<hold)return;
  try{
    const n=await get('live'),s=n.state;
    if(!F||s.lop!==F.state.lop||s.bo!==F.state.bo||String(s.phien)!==String(F.state.phien)){await loadFull();return}
    if(Number(s.cau)!==Number(L.state.cau))rev=false;
    F.state=s;L=n;draw();
  }catch(e){$('#st').textContent='Mất kết nối, đang thử lại…'}
}
async function setv(v,reload){
  hold=Date.now()+2500;
  Object.assign(L.state,v);if(!reload)draw();
  await post({action:'set',values:v});
  if(reload){hold=0;await loadFull()}
}

function draw(){
  const s=L.state,Q=F.questions[Number(s.cau)-1],open=Number(s.mo)===1;
  const ids=new Set(F.students.map(x=>x.id)),mine=L.answers.filter(a=>ids.has(a.id));
  const got=new Map(mine.map(a=>[a.id,a.ans])),cnt=[0,0,0,0];
  mine.forEach(a=>{const i=LET.indexOf(a.ans);if(i>=0)cnt[i]++});
  const mx=Math.max(1,...cnt);
  $('#num').textContent='Câu '+s.cau+'/'+F.questions.length;
  $('#q').textContent=Q?Q.q:'Không có câu hỏi. Hãy kiểm tra tab '+s.bo;
  $('#opts').innerHTML=LET.map((l,i)=>`<div class="o ${rev&&Q?(Q.ok===l?'ok':'dim'):''}" style="--c:var(--c${i})">
    <span class="l">${l}</span>${esc(Q?Q.opts[i]:'')}${rev?`<span class="n">${cnt[i]}</span><i style="width:${cnt[i]/mx*100}%"></i>`:''}</div>`).join('');
  $('#stu').innerHTML=F.students.map(x=>{const a=got.get(x.id);let c='';
    if(a){c='on';if(rev&&Q)c+=a===Q.ok?' good':' bad'}return `<span class="${c}">${esc(x.name)}</span>`}).join('');
  $('#cnt').textContent='Đã nộp '+got.size+'/'+F.students.length;
  $('#mo').textContent=open?'⏸ Khóa nhận bài':'▶ Mở nhận bài';
  $('#st').textContent=(open?'● Đang nhận bài':'■ Đã khóa')+' · '+s.lop+' · '+s.bo;
}

function go(d){
  const n=Math.min(F.questions.length,Math.max(1,Number(L.state.cau)+d));
  if(n===Number(L.state.cau))return;
  rev=false;L.answers=[];setv({cau:n,mo:1});
}
function reveal(){rev=!rev;if(rev&&Number(L.state.mo)===1)setv({mo:0});else draw()}
async function summary(){
  await loadFull();
  const key=new Map(F.questions.map((q,i)=>[i+1,q.ok]));
  const sc=new Map(F.students.map(s=>[s.id,{n:s.name,ok:0,done:0}]));
  F.results.forEach(r=>{const x=sc.get(r.id);if(!x)return;x.done++;if(key.get(r.cau)===r.ans)x.ok++});
  const rows=[...sc.values()].sort((a,b)=>b.ok-a.ok||a.n.localeCompare(b.n,'vi'));
  $('#tbl').innerHTML='<table><tr><th>#</th><th>Học sinh</th><th>Đúng</th><th>Đã trả lời</th></tr>'+
    rows.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.n)}</td><td>${r.ok}/${F.questions.length}</td><td>${r.done}</td></tr>`).join('')+'</table>';
  $('#ov').style.display='block';
}

$('#prev').onclick=()=>go(-1); $('#next').onclick=()=>go(1); $('#rev').onclick=reveal;
$('#mo').onclick=()=>setv({mo:Number(L.state.mo)===1?0:1});
$('#lop').onchange=e=>setv({lop:e.target.value,cau:1,mo:1,phien:'P'+Date.now()},true);
$('#bo').onchange=e=>setv({bo:e.target.value,cau:1,mo:1,phien:'P'+Date.now()},true);
$('#new').onclick=()=>{if(confirm('Bắt đầu phiên mới? Kết quả cũ vẫn được giữ trong Sheet.')){rev=false;setv({phien:'P'+Date.now(),cau:1,mo:1},true)}};
$('#sum').onclick=summary; $('#x').onclick=()=>$('#ov').style.display='none';
$('#api').onclick=()=>{if(askApi())location.reload()};
$('#lnk').onclick=async()=>{
  const u=new URL('scan.html',location.href).href+'#api='+encodeURIComponent(API);
  try{await navigator.clipboard.writeText(u);alert('Đã sao chép. Gửi link này sang điện thoại (Zalo) rồi mở bằng Chrome/Safari.')}catch(e){prompt('Sao chép link này:',u)}
};
addEventListener('keydown',e=>{
  if(!F||e.target.tagName==='SELECT')return;
  if(e.key==='ArrowRight')go(1); else if(e.key==='ArrowLeft')go(-1); else if(e.key===' '){e.preventDefault();reveal()}
});
if(API){loadFull().catch(()=>{$('#st').textContent='Không tải được dữ liệu. Kiểm tra URL.'});setInterval(poll,2000)}
</script>
</body>
</html>
